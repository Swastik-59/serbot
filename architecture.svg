<text x="1302.5" y="1254.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="21" fill="#2f6db5" font-weight="normal" text-anchor="middle">Ray → nearest object within 15°</text>
<text x="1302.5" y="1284.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="21" fill="#2f6db5" font-weight="normal" text-anchor="middle">stable vote over the hold</text>
